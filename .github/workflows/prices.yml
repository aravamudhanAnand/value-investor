# Refreshes prices, 52-week ranges and the Treasury yield every Saturday, then rebuilds the reports.
# Run it by hand any time from the Actions tab: Refresh prices -> Run workflow.
name: Refresh prices
on:
  schedule:
    - cron: "17 9 * * 6"   # Saturdays 09:17 UTC, after Friday's US close
  workflow_dispatch:
  push:
    paths: ["tools/refresh_prices.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/refresh_prices.py
      - run: python3 tools/build.py
      - name: Commit refreshed prices and rebuilt data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prices.csv tools/market.csv tools/settings.json tools/refresh_log.txt data
          git diff --cached --quiet || git commit -m "Refresh prices and rebuild reports"
          git pull --rebase -q origin main && git push
