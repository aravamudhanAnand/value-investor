# One-off: checks which free data sources answer from GitHub's servers, and commits the result.
name: Probe data sources
on:
  push:
    paths: ["tools/probe/probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/probe/probe.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/result.txt
          git diff --cached --quiet || git commit -m "Probe result"
          git push
